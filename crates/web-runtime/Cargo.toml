[package]
name = "web-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brimp-worker-api = { path = "../worker-api" }
blitz-dom = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
browser-dom = { path = "../browser-dom" }
http = "1"
jsc = { path = "../jsc" }
network = { path = "../network" }
persona = { path = "../persona" }
anyrender = "=0.11.1"
anyrender_vello_cpu = { version = "=0.14.0", default-features = false }
blitz-paint = { version = "=0.3.0-beta.1", default-features = false }
# Enable PNG bitmap glyph decoding in the Vello CPU renderer (e.g. emoji).
glifo = { version = "=0.1.1", features = ["png"] }
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_codegen = "32"
swc_ecma_parser = "45"
swc_ecma_transforms_base = { version = "49", features = ["inline-helpers"] }
swc_ecma_transforms_module = "55"
swc_ecma_visit = "29"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"
web-bindings = { path = "../web-bindings" }

[dev-dependencies]
async-trait = "0.1"
tungstenite = "0.30"
