[package]
name = "browser-dom"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blitz-dom = { version = "=0.3.0-beta.1", features = ["complex-scripts"] }
blitz-html = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
html5ever = "=0.39.0"
xml5ever = "=0.39.0"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
parley = "=0.10.0"
roxmltree = "=0.21.1"
stylo_traits = "=0.19.0"
style = { package = "stylo", version = "=0.19.0" }
