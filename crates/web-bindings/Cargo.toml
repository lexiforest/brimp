[package]
name = "web-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
blitz-dom = "=0.3.0-beta.1"
browser-dom = { path = "../browser-dom" }
cookie_store = "0.22.1"
encoding_rs = "0.8.35"
getrandom = "0.4"
http = "1"
jsc = { path = "../jsc" }
network = { path = "../network" }
rustybuzz = "=0.20.1"
serde_json = "1"
selectors = "0.39.0"
skia-safe = { version = "=0.99.0", default-features = false, features = ["binary-cache", "jpeg", "webp-encode"] }
style = { package = "stylo", version = "0.19.0" }
url = "2"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
