[package]
name = "brimp-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "brimp_node"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
brimp-runtime = { path = "../../crates/runtime" }
serde_json = "1"
napi = { version = "2.16", features = ["napi6", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.1"
