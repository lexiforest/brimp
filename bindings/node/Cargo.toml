[package]
name = "brimp-node"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi4", "tokio_rt"] }
napi-derive = "2.16"
persona = { path = "../../crates/persona" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
web-runtime = { path = "../../crates/web-runtime" }

[build-dependencies]
napi-build = "2.1"
