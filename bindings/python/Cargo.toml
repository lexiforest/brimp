[package]
name = "brimp-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_brimp"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "0.29"

[dependencies]
network = { path = "../../crates/network" }
persona = { path = "../../crates/persona" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
serde_json = "1"
web-runtime = { path = "../../crates/web-runtime" }
