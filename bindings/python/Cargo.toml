[package]
name = "brimp-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_brimp"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
brimp-runtime = { path = "../../crates/runtime" }
serde_json = "1"
pyo3 = { version = "0.27", features = ["abi3-py311", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.27"
