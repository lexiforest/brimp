name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - bindings/python/python/**
      - bindings/node/index.d.ts
      - crates/cli/src/args.rs
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Reference generation needs Cargo, not the optional components in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install API generators
        run: python -m pip install -r docs/requirements.txt
      - name: Build and upload documentation
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 24

      - name: Check generated references and local links
        run: python -m pytest docs/tests/test_site.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
