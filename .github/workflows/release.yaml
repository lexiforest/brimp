name: Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
      - "webkit-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to build and test (manual runs never publish)
        type: choice
        default: brimp
        options:
          - brimp
          - webkit

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Release builds do not need the development components in rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  verify:
    name: Verify release metadata
    outputs:
      package: ${{ steps.versions.outputs.package }}
      webkit_version: ${{ steps.versions.outputs.webkit_version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check versions and licenses
        id: versions
        env:
          RELEASE_PACKAGE: ${{ startsWith(github.ref, 'refs/tags/webkit-v') && 'webkit' || inputs.package || 'brimp' }}
        run: |
          echo "package=$RELEASE_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "webkit_version=$(python scripts/check_versions.py --package webkit)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/check_versions.py --package "$RELEASE_PACKAGE" --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_versions.py --package "$RELEASE_PACKAGE"
          fi
      - name: Run packaging helper tests
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libatomic1
          python -m pip install pytest
          python -m pip install wheel
          python -m pytest bindings/python/test_packaging.py bindings/test_native_runtime.py tools/webkit/test_webkit_packaging.py scripts/test_release_versions.py

  linux:
    name: Build Linux ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_34_x86_64
            node_suffix: linux-x64
            node_arch: x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_34_aarch64
            node_suffix: linux-arm64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Select build Python
        run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Install Linux tools
        run: dnf install -y fontconfig-devel freetype-devel pkgconf-pkg-config patchelf ninja-build clang libatomic

      - name: Download pinned native SDKs
        run: >-
          python scripts/prepare_native.py
          --target "${{ matrix.target }}"
          --output .native/release
          --curl-release

      - name: Install build tools
        run: python -m pip install pytest wheel 'maturin>=1.9,<2'

      - name: Build and repair wheel
        run: |
          maturin build --release --locked \
            --auditwheel repair --compatibility manylinux_2_34 \
            --manifest-path bindings/python/Cargo.toml --out dist/raw
          python bindings/python/bundle_linux_runtime.py --wheel dist/raw/*.whl --out dist/wheels

      - name: Validate and clean-install wheel
        run: |
          python bindings/python/validate_wheel.py \
            --target "${{ matrix.target }}" --directory dist/wheels
          python bindings/python/test_wheel.py \
            --target "${{ matrix.target }}" --directory dist/wheels

      - name: Build CLI and Node binding
        run: |
          cargo build --release --locked -p brimp-cli -p brimp-node
          python bindings/prepare_local.py --release --only node

      - name: Package Node modules
        run: >-
          python bindings/package_node.py
          --jsc-sdk "$BRIMP_JSC_SDK"
          --curl-sdk "$BRIMP_CURL_SDK"
          --package --main
          --out dist/node

      - name: Install Node.js
        run: |
          curl -fsSL "https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-${{ matrix.node_arch }}.tar.gz" -o /tmp/node.tar.gz
          tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
          node --version

      # Test base payloads before a candidate companion exists. The WebKit
      # matrix below verifies full installation with required dependencies.
      - name: Test Node runtime payload
        run: python bindings/test_node_distribution.py --directory dist/node

      - name: Validate Node packages
        run: python bindings/package_node.py --validate --out dist/node

      - name: Package and test CLI
        run: |
          python bindings/package_cli.py \
            --target "${{ matrix.target }}" \
            --jsc-sdk "$BRIMP_JSC_SDK" --curl-sdk "$BRIMP_CURL_SDK" \
            --licenses "$BRIMP_LICENSE_DIR" --out dist/cli
          python bindings/package_cli.py --validate --out dist/cli
          for archive in dist/cli/*.tar.gz dist/cli/*.zip; do
            if [ -f "$archive" ]; then
              BRIMP_CLI_ARCHIVE="$archive" python -m pytest bindings/test_cli_distribution.py
            fi
          done

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/wheels/*.whl
          if-no-files-found: error

      - name: Upload Node platform package
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: dist/node/brimp-${{ matrix.node_suffix }}-*.tgz
          if-no-files-found: error

  native:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            deployment_target: "26.0"
            node_suffix: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            deployment_target: ""
            node_suffix: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Download pinned native SDKs
        run: >-
          python scripts/prepare_native.py
          --target "${{ matrix.target }}"
          --output .native/release
          --curl-release

      - name: Install build tools
        run: python -m pip install pytest 'maturin>=1.9,<2'

      - name: Build and repair wheel
        run: |
          maturin build --release --locked \
            --auditwheel repair --compatibility pypi \
            --manifest-path bindings/python/Cargo.toml --out dist/raw
          mkdir -p dist/wheels
          if [ "$RUNNER_OS" = "Windows" ]; then
            python bindings/python/bundle_windows_runtime.py \
              --wheel dist/raw/*.whl --out dist/wheels
          else
            cp dist/raw/*.whl dist/wheels/
          fi

      - name: Validate and clean-install wheel
        run: |
          python bindings/python/validate_wheel.py \
            --target "${{ matrix.target }}" --directory dist/wheels
          python bindings/python/test_wheel.py \
            --target "${{ matrix.target }}" --directory dist/wheels

      - name: Build CLI and Node binding
        run: |
          cargo build --release --locked -p brimp-cli -p brimp-node
          python bindings/prepare_local.py --release --only node

      - name: Package Node modules
        run: >-
          python bindings/package_node.py
          --jsc-sdk "$BRIMP_JSC_SDK"
          --curl-sdk "$BRIMP_CURL_SDK"
          --package --main
          --out dist/node

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      # Test base payloads before a candidate companion exists. The WebKit
      # matrix below verifies full installation with required dependencies.
      - name: Test Node runtime payload
        run: python bindings/test_node_distribution.py --directory dist/node

      - name: Validate Node packages
        run: python bindings/package_node.py --validate --out dist/node

      - name: Package and test CLI
        run: |
          python bindings/package_cli.py \
            --target "${{ matrix.target }}" \
            --jsc-sdk "$BRIMP_JSC_SDK" --curl-sdk "$BRIMP_CURL_SDK" \
            --licenses "$BRIMP_LICENSE_DIR" --out dist/cli
          python bindings/package_cli.py --validate --out dist/cli
          for archive in dist/cli/*.tar.gz dist/cli/*.zip; do
            if [ -f "$archive" ]; then
              BRIMP_CLI_ARCHIVE="$archive" python -m pytest bindings/test_cli_distribution.py
            fi
          done

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/wheels/*.whl
          if-no-files-found: error

      - name: Upload Node platform package
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: dist/node/brimp-${{ matrix.node_suffix }}-*.tgz
          if-no-files-found: error

      - name: Upload Node wrapper package
        if: matrix.node_suffix == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: node-main
          path: dist/node/brimp-npm-*.tgz
          if-no-files-found: error

  webkit:
    name: Test WebKit companion ${{ matrix.target }}
    needs: [verify, linux, native]
    # Only published WebKit platforms gate releases. Windows and Linux arm64
    # still validate their JSC payloads above; they have no WebKit binary yet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: darwin-arm64
            runner: xcode-27
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Install packaging tools
        if: needs.verify.outputs.package == 'webkit'
        run: python -m pip install 'wheel==0.45.1' 'auditwheel==6.8.0' pytest
      - name: Install Linux host dependencies
        if: runner.os == 'Linux' && needs.verify.outputs.package == 'webkit'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libwebkitgtk-6.0-dev libavif16 libjxl0.7 libatomic1 nlohmann-json3-dev patchelf \
            xvfb xauth dbus-x11 bubblewrap xdg-dbus-proxy fonts-dejavu-core libgl1-mesa-dri
      - name: Download verified WebKit SDK
        if: needs.verify.outputs.package == 'webkit'
        run: python tools/webkit/download.py --target '${{ matrix.target }}' --output .native/webkit-release
      - name: Build host and package engine
        if: needs.verify.outputs.package == 'webkit'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export CXX=clang++-18
          fi
          python tools/webkit/package.py --sdk "$BRIMP_WEBKIT_SDK" --out dist/webkit
      - name: Download base Python wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.rust_target }}
          path: dist/base-wheels
      - name: Download base Node platform package
        uses: actions/download-artifact@v4
        with:
          name: node-${{ matrix.rust_target }}
          path: dist/base-node
      - name: Download base Node wrapper
        uses: actions/download-artifact@v4
        with:
          name: node-main
          path: dist/base-node
      - name: Test installed packages
        shell: bash
        env:
          RELEASE_PACKAGE: ${{ needs.verify.outputs.package }}
          WEBKIT_VERSION: ${{ needs.verify.outputs.webkit_version }}
        run: |
          if [ "$RELEASE_PACKAGE" = webkit ]; then
            companion=(--dist dist/webkit --hide-sdk "$BRIMP_WEBKIT_SDK")
          else
            companion=(--published "$WEBKIT_VERSION")
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            docker build -f tools/webkit/runtime.Dockerfile \
              --build-arg TEST_UID="$(id -u)" -t brimp-webkit-runtime-test tools/webkit
            # Nested user namespaces are needed by WebKit's own process sandbox.
            docker run --rm --privileged \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
              brimp-webkit-runtime-test tools/webkit/test_distribution.py \
              "${companion[@]}" --base-wheels dist/base-wheels --base-node dist/base-node
          else
            python tools/webkit/test_distribution.py \
              "${companion[@]}" --base-wheels dist/base-wheels --base-node dist/base-node
          fi
      - name: Upload WebKit packages
        if: needs.verify.outputs.package == 'webkit'
        uses: actions/upload-artifact@v4
        with:
          name: webkit-${{ matrix.target }}
          path: dist/webkit/*
          if-no-files-found: error
          compression-level: 0

  webkit-macos26:
    name: Test installed packages on macOS 26
    needs: [verify, native, webkit]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: wheel-aarch64-apple-darwin
          path: dist/base-wheels
      - uses: actions/download-artifact@v4
        with:
          name: node-aarch64-apple-darwin
          path: dist/base-node
      - uses: actions/download-artifact@v4
        with:
          name: node-main
          path: dist/base-node
      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.package == 'webkit'
        with:
          name: webkit-darwin-arm64
          path: dist/webkit
      - name: Verify automatic discovery and both engines on the minimum OS
        env:
          RELEASE_PACKAGE: ${{ needs.verify.outputs.package }}
          WEBKIT_VERSION: ${{ needs.verify.outputs.webkit_version }}
        run: |
          if [ "$RELEASE_PACKAGE" = webkit ]; then
            companion=(--dist dist/webkit)
          else
            companion=(--published "$WEBKIT_VERSION")
          fi
          python tools/webkit/test_distribution.py "${companion[@]}" \
            --base-wheels dist/base-wheels --base-node dist/base-node

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs:
      - verify
      - linux
      - native
      - webkit
      - webkit-macos26
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download wheels
        if: needs.verify.outputs.package == 'brimp'
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Download Node packages
        if: needs.verify.outputs.package == 'brimp'
        uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: dist/node
          merge-multiple: true

      - name: Download CLI archives
        if: needs.verify.outputs.package == 'brimp'
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true

      - name: Download WebKit packages
        if: needs.verify.outputs.package == 'webkit'
        uses: actions/download-artifact@v4
        with:
          pattern: webkit-*
          path: dist/webkit
          merge-multiple: true

      - name: Validate release artifacts
        if: needs.verify.outputs.package == 'brimp'
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            python bindings/python/validate_wheel.py \
              --target "$target" --directory dist/wheels \
              --tag "$GITHUB_REF_NAME"
          done
          test "$(find dist/wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 4
          python bindings/package_node.py --validate --all --out dist/node
          python bindings/package_cli.py --validate --all --out dist/cli
          python scripts/check_versions.py --tag "$GITHUB_REF_NAME"

      - name: Validate companion release artifacts
        if: needs.verify.outputs.package == 'webkit'
        # The complete companion release is macOS arm64 + Linux x64.
        # Missing Windows WebKit must not prevent publication.
        run: |
          python scripts/check_versions.py --package webkit --tag "$GITHUB_REF_NAME"
          python tools/webkit/validate.py dist/webkit

      - name: Write checksums
        env:
          RELEASE_PACKAGE: ${{ needs.verify.outputs.package }}
        run: |
          cd dist
          if [ "$RELEASE_PACKAGE" = webkit ]; then
            sha256sum webkit/* > SHA256SUMS
          else
            sha256sum wheels/*.whl node/*.tgz cli/*.tar.gz cli/*.zip > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Collect Python distributions
        env:
          RELEASE_PACKAGE: ${{ needs.verify.outputs.package }}
        run: |
          mkdir -p dist/pypi
          if [ "$RELEASE_PACKAGE" = webkit ]; then
            cp dist/webkit/*.whl dist/pypi/
          else
            cp dist/wheels/*.whl dist/pypi/
          fi

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - name: Publish npm packages
        if: needs.verify.outputs.package == 'brimp'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in \
            dist/node/brimp-darwin-arm64-*.tgz \
            dist/node/brimp-linux-x64-*.tgz \
            dist/node/brimp-linux-arm64-*.tgz \
            dist/node/brimp-win32-x64-*.tgz
          do
            npm publish "$package" --access public --provenance
          done
          npm publish dist/node/brimp-npm-*.tgz --access public --provenance

      - name: Publish companion npm packages
        if: needs.verify.outputs.package == 'webkit'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(python scripts/check_versions.py --package webkit)
          npm publish "dist/webkit/brimp-webkit-darwin-arm64-$version.tgz" --access public --provenance
          npm publish "dist/webkit/brimp-webkit-linux-x64-$version.tgz" --access public --provenance
          npm publish "dist/webkit/brimp-webkit-$version.tgz" --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Companion releases must not replace the CLI installer's latest release.
          make_latest: ${{ needs.verify.outputs.package == 'brimp' && 'true' || 'false' }}
          files: |
            dist/cli/*
            dist/wheels/*.whl
            dist/node/*.tgz
            dist/webkit/*
            dist/SHA256SUMS
