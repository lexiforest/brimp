name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lexbor:
    name: Standalone Lexbor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRIMP_JSC_LIB_DIR: /nonexistent/jsc
      BRIMP_CURL_LIB_DIR: /nonexistent/curl
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test without native SDKs or language bindings
        run: cargo test --locked -p brimp-lexbor
      - name: Sanitize Lexbor boundary
        run: python3 scripts/test_lexbor_boundary.py

  test:
    name: Runtime and bindings
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download pinned native SDKs
        run: >-
          python scripts/prepare_native.py
          --target aarch64-apple-darwin
          --output .native/aarch64-apple-darwin

      - name: Build native bindings
        run: cargo build --locked -p brimp-cli -p brimp-python -p brimp-node

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Check runtime dependency boundary
        run: python3 scripts/check_runtime_dependencies.py

      - name: Test Python and Node bindings
        run: |
          python -m pip install pytest
          python3 bindings/prepare_local.py
          PYTHONPATH=bindings/python/python python3 -m pytest bindings/python/tests
          node --test bindings/node/test/*.test.mjs
          PYTHONPATH=bindings/python/python python3 -m pytest docs/tests/test_examples.py

      - name: Sanitize Lexbor boundary
        run: python3 scripts/test_lexbor_boundary.py

      - name: Verify bundled web primitives
        working-directory: crates/runtime/js/vendor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- core.bundle.js manifest.json ../plugins/storage.js

      - name: Prepare browser regression fixtures
        working-directory: tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:fixtures

      - name: Test browser regressions
        working-directory: tests
        run: npm test

      - name: Upload browser regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-report
          path: tests/results/
          if-no-files-found: ignore

      - name: Build and smoke-test native packages
        run: |
          python -m pip install 'maturin>=1.9,<2'
          mkdir -p "$RUNNER_TEMP/brimp-packages"
          maturin build --locked --manifest-path bindings/python/Cargo.toml --out "$RUNNER_TEMP/brimp-packages"
          python -m pip install --no-deps "$RUNNER_TEMP"/brimp-packages/*.whl
          python -m pytest bindings/python/tests
          npm pack ./bindings/node --pack-destination "$RUNNER_TEMP/brimp-packages"
          npm install --prefix "$RUNNER_TEMP/brimp-installed" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/brimp-packages/*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {pathToFileURL} from 'node:url';
          const api = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/brimp-installed/node_modules/@brimp/brimp/index.js`));
          const session = await api.createSession({plugins: [api.storagePlugin(), api.canvasPlugin(), api.extractionPlugin()]});
          try {
            const page = await session.newPage();
            assert.equal(await page.evaluate('6 * 7'), 42);
            assert.equal(await page.evaluate("localStorage.x='installed'; localStorage.x"), 'installed');
            assert.deepEqual(await page.evaluate("Array.from(document.createElement('canvas').getContext('2d').getImageData(0,0,1,1).data)"), [0,0,0,0]);
            await page.evaluate("document.body.innerHTML='<article><h1>Package check</h1><p>Extracted from the installed package.</p></article>'; null");
            assert.match((await page.extract({contentSelector: 'article'})).content, /installed package/);
          } finally { await session.close(); }
          JS

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  engine:
    name: JSC deferred work (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download pinned native SDKs
        run: python scripts/prepare_native.py --target ${{ matrix.target }} --output .native/${{ matrix.target }}
      - name: Test engine ownership and asynchronous WASM
        run: cargo test --locked -p brimp-jsc --test runtime

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install API generators
        run: python -m pip install -r docs/requirements.txt

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Check generated references and local links
        run: python -m pytest docs/tests/test_site.py
