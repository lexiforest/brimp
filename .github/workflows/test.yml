name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            deployment_target: "11.0"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deployment_target: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deployment_target: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            deployment_target: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      PYTHONUTF8: "1"
      # Use the components installed below instead of adding local formatting tools.
      RUSTUP_TOOLCHAIN: "1.99.1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config patchelf ninja-build clang

      - name: Prepare pinned native SDKs
        run: >-
          python scripts/prepare_native.py
          --target "${{ matrix.target }}"
          --output .native/test
          --curl-release

      - name: Install test and packaging tools
        run: python -m pip install pytest 'maturin>=1.9,<2'

      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            !target/debug/incremental
          key: native-build-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'scripts/prepare_native.py') }}

      - name: Build native bindings
        run: cargo build --locked -p brimp-cli -p brimp-python -p brimp-node

      # Save immediately so later test failures do not discard a successful build.
      - name: Save native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            !target/debug/incremental
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Check runtime dependency boundary
        run: python scripts/check_runtime_dependencies.py

      - name: Prepare local bindings
        run: python bindings/prepare_local.py

      - name: Test Python bindings and tutorials
        env:
          PYTHONPATH: bindings/python/python
        run: python -m pytest bindings/python/tests docs/tests/test_examples.py

      - name: Test Node bindings
        run: node --test "bindings/node/test/*.test.mjs"

      - name: Test CLI and build helpers
        run: python -m pytest crates/cli/tests bindings/python/test_packaging.py

      - name: Verify bundled web primitives
        working-directory: crates/runtime/js/vendor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- core.bundle.js storage.bundle.js input-color.bundle.js manifest.json

      - name: Install runtime and workload test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test runtime environment
        working-directory: tests
        run: npm run test:runtime

      - name: Prepare browser regression fixtures
        working-directory: tests
        run: npm run prepare:fixtures

      - name: Test browser regressions
        working-directory: tests
        run: npm run test:workloads

      - name: Upload browser regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-report-${{ matrix.target }}
          path: tests/results/
          if-no-files-found: ignore

      - name: Build Python wheel
        run: |
          maturin build --locked --auditwheel repair --compatibility pypi \
            --manifest-path bindings/python/Cargo.toml --out dist/raw
          mkdir -p dist/wheels
          if [ "$RUNNER_OS" = "Windows" ]; then
            python bindings/python/bundle_windows_runtime.py --wheel dist/raw/*.whl --out dist/wheels
          else
            cp dist/raw/*.whl dist/wheels/
          fi

      - name: Test installed Python wheel
        run: |
          python -m pip install --no-deps dist/wheels/*.whl
          python -m pytest bindings/python/tests

      - name: Build and validate Node packages
        run: |
          python bindings/package_node.py \
            --jsc-sdk "$BRIMP_JSC_SDK" --curl-sdk "$BRIMP_CURL_SDK" \
            --package --main --out dist/node
          python bindings/package_node.py --validate --out dist/node

      - name: Test installed Node packages
        run: |
          npm install --offline --prefix "$RUNNER_TEMP/brimp-installed" --ignore-scripts --no-audit --no-fund --omit=optional dist/node/*.tgz
          cp bindings/node/smoke.mjs "$RUNNER_TEMP/brimp-installed/"
          cd "$RUNNER_TEMP/brimp-installed"
          node smoke.mjs

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
