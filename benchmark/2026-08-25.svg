<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="title description">
<title id="title">Browser benchmark comparison</title>
<desc id="description">Median latency, median peak memory, and correctness by engine and process topology.</desc>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #172033; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #657089; }
.heading { font-size: 14px; font-weight: 700; }
.label { font-size: 13px; font-weight: 600; }
.value { font-size: 12px; font-variant-numeric: tabular-nums; }
.axis { stroke: #cbd2df; stroke-width: 1; }
</style>
