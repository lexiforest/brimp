[workspace]
members = [
    "crates/jsc-sys",
    "crates/jsc",
    "crates/browser-dom",
    "crates/web-bindings",
    "crates/web-runtime",
    "crates/screenshot",
    "crates/network",
    "crates/cli",
    "crates/persona",
    "crates/cdp",
    "bindings/python",
    "bindings/node",
]
resolver = "3"

[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
