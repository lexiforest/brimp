site_name: Brimp Python API
site_url: https://docs.brimp.ai/reference/python/
docs_dir: reference/python
site_dir: public/reference/python
use_directory_urls: true
extra_css: [styles/reference.css]
nav:
  - Session and pages: index.md
  - Plugins: plugins.md
  - Exceptions: errors.md
  - Tutorials: /examples/python/
  - Brimp docs: /
theme:
  name: mkdocs
  color_mode: auto
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../bindings/python/python]
          options:
            allow_inspection: false
            inherited_members: true
            show_if_no_docstring: true
            show_root_heading: true
            show_source: true
            show_bases: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.superfences
