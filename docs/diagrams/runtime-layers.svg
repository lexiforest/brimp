<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 8 5 L 0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="710" rx="24" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
<text x="40" y="54" font-size="27" font-weight="700">One runtime, three interfaces</text>
<text x="40" y="84" font-size="16" fill="#475569">All interfaces embed the same browser runtime in process.</text><rect x="40" y="125" width="290" height="90" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="185.0" y="156" text-anchor="middle" font-size="21" font-weight="700">CLI</text><text x="185.0" y="183" text-anchor="middle" font-size="16" fill="#475569">brimp-cli</text><path d="M 185 215 L 185 255 L 500 255 L 500 278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="125" width="290" height="90" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="500.0" y="156" text-anchor="middle" font-size="21" font-weight="700">Python</text><text x="500.0" y="183" text-anchor="middle" font-size="16" fill="#475569">Synchronous Session / Page</text><path d="M 500 215 L 500 255 L 500 255 L 500 278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="125" width="290" height="90" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="815.0" y="156" text-anchor="middle" font-size="21" font-weight="700">Node.js</text><text x="815.0" y="183" text-anchor="middle" font-size="16" fill="#475569">Async Session / Page</text><path d="M 815 215 L 815 255 L 500 255 L 500 278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="280" width="620" height="125" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/><text x="500.0" y="311" text-anchor="middle" font-size="21" font-weight="700">brimp-runtime</text><text x="500.0" y="338" text-anchor="middle" font-size="16" fill="#475569">Browser APIs • sessions • plugins • scheduling</text><text x="500.0" y="362" text-anchor="middle" font-size="16" fill="#475569">A page owns its JavaScript realm and canonical DOM</text><path d="M 500 405 L 500 438 L 185 438 L 185 470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="472" width="290" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="185.0" y="503" text-anchor="middle" font-size="21" font-weight="700">brimp-jsc</text><text x="185.0" y="530" text-anchor="middle" font-size="16" fill="#475569">Engine ownership</text><text x="185.0" y="554" text-anchor="middle" font-size="16" fill="#475569">Protected JS values</text><text x="185.0" y="578" text-anchor="middle" font-size="16" fill="#475569">JavaScriptCore</text><path d="M 500 405 L 500 438 L 500 438 L 500 470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="472" width="290" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="503" text-anchor="middle" font-size="21" font-weight="700">brimp-lexbor</text><text x="500.0" y="530" text-anchor="middle" font-size="16" fill="#475569">Safe DOM arena</text><text x="500.0" y="554" text-anchor="middle" font-size="16" fill="#475569">HTML / CSS parsing</text><text x="500.0" y="578" text-anchor="middle" font-size="16" fill="#475569">Lexbor</text><path d="M 500 405 L 500 438 L 815 438 L 815 470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="472" width="290" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="815.0" y="503" text-anchor="middle" font-size="21" font-weight="700">brimp-net</text><text x="815.0" y="530" text-anchor="middle" font-size="16" fill="#475569">HTTP / WebSocket transport</text><text x="815.0" y="554" text-anchor="middle" font-size="16" fill="#475569">Request / response bytes</text><text x="815.0" y="578" text-anchor="middle" font-size="16" fill="#475569">curl-impersonate</text><text x="40" y="659" font-size="16" fill="#475569">Core: DOM, JavaScript, networking and WebCrypto. Specialized APIs use explicit plugins.</text></g></svg>