<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 8 5 L 0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="760" rx="24" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
<text x="40" y="54" font-size="27" font-weight="700">Inside one page</text>
<text x="40" y="84" font-size="16" fill="#475569">Commands cross the host boundary; JavaScript values and DOM pointers stay on the owner thread.</text><rect x="40" y="125" width="290" height="105" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="185.0" y="156" text-anchor="middle" font-size="21" font-weight="700">Host interface</text><text x="185.0" y="183" text-anchor="middle" font-size="16" fill="#475569">CLI / Python / Node</text><text x="185.0" y="207" text-anchor="middle" font-size="16" fill="#475569">Typed commands and handles</text><path d="M 330 177 L 415 177" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="371" y="159" text-anchor="middle" font-size="15" fill="#475569">commands</text><rect x="420" y="115" width="575" height="445" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="445" y="150" font-size="18" font-weight="700">Page owner thread</text><rect x="450" y="177" width="245" height="100" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/><text x="572.5" y="208" text-anchor="middle" font-size="21" font-weight="700">JavaScriptCore</text><text x="572.5" y="235" text-anchor="middle" font-size="16" fill="#475569">Realm + GC roots</text><text x="572.5" y="259" text-anchor="middle" font-size="16" fill="#475569">Core APIs + plugin installers</text><rect x="725" y="177" width="240" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="208" text-anchor="middle" font-size="21" font-weight="700">Lexbor DOM</text><text x="845.0" y="235" text-anchor="middle" font-size="16" fill="#475569">Canonical node identity</text><text x="845.0" y="259" text-anchor="middle" font-size="16" fill="#475569">Parser + DOM mutations</text><path d="M 695 225 L 722 225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="325" width="515" height="85" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="707.5" y="356" text-anchor="middle" font-size="21" font-weight="700">Task queue + microtask checkpoints</text><text x="707.5" y="383" text-anchor="middle" font-size="16" fill="#475569">Timers • network results • plugin completions</text><path d="M 575 325 L 575 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="458" font-size="17" font-weight="700">Navigation replaces the realm</text><text x="450" y="489" font-size="16" fill="#475569">Invalidate old handles • cancel pending realm calls</text><text x="450" y="515" font-size="16" fill="#475569">Run disposers • install plugins in the new realm</text><rect x="40" y="325" width="290" height="105" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><text x="185.0" y="356" text-anchor="middle" font-size="21" font-weight="700">Host plugin handler</text><text x="185.0" y="383" text-anchor="middle" font-size="16" fill="#475569">Trusted context + copied values</text><text x="185.0" y="407" text-anchor="middle" font-size="16" fill="#475569">No reentry into its own page</text><path d="M 450 245 L 365 245 L 365 295 L 185 295 L 185 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="262" y="279" text-anchor="middle" font-size="15" fill="#475569">host.call()</text><path d="M 330 375 L 447 375" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="357" text-anchor="middle" font-size="15" fill="#475569">result</text><rect x="450" y="620" width="515" height="90" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="707.5" y="651" text-anchor="middle" font-size="21" font-weight="700">brimp-net transport</text><text x="707.5" y="678" text-anchor="middle" font-size="16" fill="#475569">HTTP / WebSocket I/O outside the page owner thread</text><path d="M 965 366 L 1010 366 L 1010 665 L 968 665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 710 620 L 710 565 L 1005 565 L 1005 415 L 710 415 L 710 412" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="627" font-size="17" font-weight="700">Lifetime rules</text><text x="40" y="657" font-size="16" fill="#475569">Detached node: handle still works.</text><text x="40" y="684" font-size="16" fill="#475569">New navigation: old handle is stale.</text></g></svg>